<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面试舱交互原型</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071118;
      --sidebar: #0a151c;
      --surface: #0e1b24;
      --surface-raised: #13242d;
      --surface-soft: #172a34;
      --border: #29404b;
      --border-strong: #3b5964;
      --text: #f2f7f6;
      --muted: #a9bbc0;
      --quiet: #7f959c;
      --accent: #38d7b7;
      --accent-ink: #032c25;
      --accent-soft: #123b36;
      --amber: #f4c76b;
      --blue: #7dc9f2;
      --danger: #ff8e80;
      --focus: #9debdc;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.24);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background: var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    select,
    input[type="checkbox"] {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    button:disabled {
      cursor: not-allowed;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 224px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 22px 16px;
      border-right: 1px solid #1e323b;
      background: var(--sidebar);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      padding: 2px 6px 22px;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid #2e7065;
      border-radius: 7px;
      color: var(--accent);
      background: #0d2926;
      font-family: Consolas, monospace;
      font-weight: 800;
    }

    .brand strong,
    .brand small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand strong {
      font-size: 0.96rem;
    }

    .brand small {
      margin-top: 3px;
      color: var(--quiet);
      font-size: 0.72rem;
    }

    .sidebar nav {
      display: grid;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      text-decoration: none;
    }

    .nav-item.active {
      border-color: #285a53;
      color: var(--text);
      background: #102823;
    }

    .profile {
      display: grid;
      gap: 3px;
      margin-top: auto;
      padding: 15px 12px 4px;
      border-top: 1px solid #1e323b;
    }

    .profile span {
      color: var(--quiet);
      font-size: 0.76rem;
    }

    .mobile-bar {
      display: none;
    }

    main {
      min-width: 0;
      padding: 26px 30px 46px;
    }

    .workspace {
      width: min(100%, 1480px);
      margin: 0 auto;
    }

    .command-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .mode-tabs,
    .sort-tabs,
    .pursuit-control {
      display: inline-grid;
      grid-auto-flow: column;
      grid-auto-columns: max-content;
      gap: 4px;
      min-width: 0;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0b1820;
    }

    .mode-tab,
    .sort-tab,
    .pursuit-button {
      min-height: 38px;
      padding: 0 15px;
      border: 0;
      border-radius: 5px;
      color: var(--muted);
      background: transparent;
      font-weight: 700;
      transition: color 180ms ease, background-color 180ms ease;
    }

    .mode-tab[aria-selected="true"],
    .sort-tab[aria-pressed="true"],
    .pursuit-button[aria-pressed="true"] {
      color: var(--text);
      background: var(--surface-soft);
    }

    .start-button {
      min-width: 144px;
      min-height: 46px;
      padding: 0 22px;
      border: 1px solid #47e3c4;
      border-radius: 6px;
      color: var(--accent-ink);
      background: var(--accent);
      box-shadow: 0 10px 28px rgba(56, 215, 183, 0.16);
      font-weight: 800;
      transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease, opacity 180ms ease;
    }

    .start-button:disabled {
      border-color: #33464f;
      color: #72858b;
      background: #1c2b33;
      box-shadow: none;
      opacity: 0.8;
    }

    .settings-bar {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
      margin: 16px 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .setting-label {
      flex: 0 0 auto;
      color: var(--quiet);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .round-control {
      display: inline-grid;
      grid-template-columns: 34px 42px 34px;
      align-items: center;
      height: 36px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      overflow: hidden;
    }

    .round-control button,
    .round-control output {
      display: grid;
      height: 100%;
      place-items: center;
      border: 0;
      color: var(--text);
      background: #0a171f;
    }

    .round-control button:hover {
      background: var(--surface-soft);
    }

    .round-control output {
      border-right: 1px solid var(--border);
      border-left: 1px solid var(--border);
      font-family: Consolas, monospace;
      font-weight: 800;
    }

    .switch-label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .switch-label input {
      width: 36px;
      height: 20px;
      margin: 0;
      accent-color: var(--accent);
    }

    .smart-close-copy {
      display: grid;
      min-width: 90px;
      line-height: 1.25;
    }

    .smart-close-copy strong {
      color: var(--text);
      font-size: 0.76rem;
    }

    .more-button,
    .filter-button,
    .clear-button,
    .dialog-close {
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      color: var(--text);
      background: #0b1820;
      font-weight: 700;
    }

    .more-button {
      margin-left: auto;
    }

    .mobile-settings-summary {
      display: none;
    }

    .free-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) repeat(3, minmax(132px, 0.42fr)) auto;
      gap: 10px;
      align-items: end;
      margin: 16px 0 12px;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .field span {
      color: var(--quiet);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      height: 42px;
      min-width: 0;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      color: var(--text);
      background: #0a171f;
    }

    .field input::placeholder {
      color: #6f858c;
    }

    .mobile-filter-row {
      display: none;
    }

    .list-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      margin-bottom: 14px;
    }

    .result-count {
      color: var(--quiet);
      font-family: Consolas, monospace;
      font-size: 0.8rem;
    }

    .question-grid,
    .role-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .question-card,
    .role-card {
      position: relative;
      display: grid;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: var(--surface);
      text-align: left;
      transition: border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
    }

    .question-card:hover,
    .role-card:hover {
      border-color: var(--border-strong);
      background: var(--surface-raised);
    }

    .question-card[aria-checked="true"],
    .role-card[aria-checked="true"] {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 1px rgba(56, 215, 183, 0.2);
    }

    .question-card {
      grid-template-rows: auto minmax(78px, auto) auto;
      min-height: 184px;
      padding: 17px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 23px;
      gap: 10px;
    }

    .question-code {
      color: var(--accent);
      font-family: Consolas, monospace;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .selected-check {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 50%;
      color: var(--accent-ink);
      background: var(--accent);
      font-size: 0.8rem;
      font-weight: 900;
      visibility: hidden;
    }

    [aria-checked="true"] .selected-check {
      visibility: visible;
    }

    .question-text {
      display: -webkit-box;
      align-self: center;
      margin: 14px 0 16px;
      overflow: hidden;
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.55;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-self: end;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 27px;
      padding: 0 9px;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      color: var(--muted);
      background: #0b1820;
      font-size: 0.73rem;
      font-weight: 700;
    }

    .tag.domain {
      border-color: #2a6d61;
      color: #77e4cf;
    }

    .tag.level {
      border-color: #6a5931;
      color: var(--amber);
    }

    .tag.type {
      border-color: #31566a;
      color: var(--blue);
    }

    .mode-panel[hidden] {
      display: none;
    }

    .role-grid {
      margin-top: 18px;
    }

    .role-card {
      min-height: 150px;
      padding: 18px;
    }

    .role-card strong {
      align-self: end;
      margin: 28px 0 12px;
      font-size: 1.05rem;
    }

    .role-card small {
      color: var(--quiet);
      line-height: 1.5;
    }

    .role-code {
      color: var(--accent);
      font-family: Consolas, monospace;
      font-size: 0.74rem;
      font-weight: 800;
    }

    .resume-context {
      display: grid;
      grid-template-columns: clamp(220px, 19vw, 274px) minmax(0, 1fr);
      height: clamp(500px, calc(100dvh - 230px), 850px);
      min-width: 0;
      margin-top: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    .resume-mobile-picker {
      display: none;
    }

    .resume-mobile-selection input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .resume-mobile-count {
      margin-left: auto;
      color: var(--accent);
      font-size: 0.7rem;
    }

    .resume-library {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      border-right: 1px solid var(--border);
      background: #09161d;
    }

    .resume-library-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .resume-library-copy {
      display: grid;
      min-width: 0;
      gap: 3px;
    }

    .resume-library-copy strong {
      font-size: 0.9rem;
    }

    .resume-library-copy span {
      color: var(--quiet);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .resume-profile-button {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      flex: 0 0 auto;
      padding: 0;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      color: var(--muted);
      background: #0d1d25;
      font-size: 1.12rem;
      font-weight: 400;
    }

    .resume-file-list {
      min-height: 0;
      padding: 7px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-color: var(--border-strong) transparent;
    }

    .resume-file-row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      align-items: stretch;
      min-width: 0;
      margin-bottom: 4px;
      border: 1px solid transparent;
      border-radius: 6px;
      transition: border-color 180ms ease, background-color 180ms ease;
    }

    .resume-file-row:hover {
      background: #10212a;
    }

    .resume-file-row.is-active {
      border-color: #356357;
      background: #102823;
    }

    .resume-file-row.is-selected:not(.is-active) {
      background: #0c211f;
    }

    .resume-file-check {
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .resume-file-check input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .resume-file-button {
      display: grid;
      min-width: 0;
      padding: 10px 10px 10px 2px;
      border: 0;
      color: var(--text);
      background: transparent;
      text-align: left;
    }

    .resume-file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .resume-file-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      margin-top: 6px;
      color: var(--quiet);
      font-size: 0.69rem;
    }

    .resume-format {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 6px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      color: var(--blue);
      font-family: Consolas, monospace;
      font-size: 0.65rem;
      font-weight: 800;
    }

    .resume-file-status {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .resume-file-status::before {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 5px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
      vertical-align: 1px;
    }

    .resume-reader {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      background: #0b171e;
    }

    .resume-reader-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;
      min-height: 64px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: #0e1c24;
    }

    .resume-reader-identity {
      min-width: 0;
    }

    .resume-reader-title-line {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
    }

    .resume-reader-title-line h2 {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.96rem;
    }

    .resume-reader-meta {
      margin: 4px 0 0;
      overflow: hidden;
      color: var(--quiet);
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.72rem;
    }

    .resume-reader-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
    }

    .resume-reader-actions .more-button {
      margin-left: 0;
    }

    .resume-reader-body {
      min-width: 0;
      min-height: 0;
      padding: 22px clamp(18px, 4vw, 54px) 42px;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-color: var(--border-strong) transparent;
      scroll-behavior: smooth;
    }

    .resume-document-stack {
      display: grid;
      gap: 22px;
      width: min(100%, 850px);
      margin: 0 auto;
    }

    .document-page,
    .markdown-document,
    .resume-editor-shell {
      width: min(100%, 850px);
      margin: 0 auto;
      border: 1px solid #d4dce0;
      border-radius: 3px;
      color: #19252b;
      background: #f7f9fa;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.2);
    }

    .document-page {
      min-height: 720px;
      padding: clamp(30px, 5vw, 62px);
    }

    .document-page-head {
      padding-bottom: 20px;
      border-bottom: 2px solid #1b7468;
    }

    .document-page-head h1 {
      margin: 0;
      color: #102c31;
      font-size: clamp(1.45rem, 2.4vw, 2rem);
    }

    .document-page-head p {
      margin: 7px 0 0;
      color: #4d626a;
      line-height: 1.5;
    }

    .document-section {
      margin-top: 28px;
    }

    .document-section h2 {
      margin: 0 0 10px;
      color: #1b7468;
      font-size: 0.86rem;
      text-transform: uppercase;
    }

    .document-section h3 {
      margin: 18px 0 5px;
      color: #17333a;
      font-size: 0.96rem;
    }

    .document-section p,
    .document-section li {
      color: #354a52;
      font-size: 0.89rem;
      line-height: 1.75;
    }

    .document-section p {
      margin: 7px 0;
    }

    .document-section ul {
      margin: 7px 0 0;
      padding-left: 20px;
    }

    .markdown-document {
      min-height: 100%;
      padding: clamp(28px, 5vw, 58px);
    }

    .markdown-content {
      max-width: 72ch;
      margin: 0 auto;
      color: #2c4047;
      font-size: 0.94rem;
      line-height: 1.82;
    }

    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3 {
      color: #102c31;
      line-height: 1.35;
    }

    .markdown-content h1 {
      margin: 0 0 26px;
      padding-bottom: 16px;
      border-bottom: 2px solid #1b7468;
      font-size: 1.72rem;
    }

    .markdown-content h2 {
      margin: 30px 0 10px;
      font-size: 1.12rem;
    }

    .markdown-content h3 {
      margin: 22px 0 8px;
      font-size: 0.98rem;
    }

    .markdown-content p,
    .markdown-content ul {
      margin: 0 0 14px;
    }

    .markdown-content ul {
      padding-left: 22px;
    }

    .markdown-content code {
      padding: 2px 5px;
      border-radius: 3px;
      color: #075e54;
      background: #e2eeeb;
      font-family: Consolas, monospace;
    }

    .resume-editor-shell {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-height: 100%;
      padding: 14px;
      color: var(--text);
      background: #0e1b24;
      border-color: var(--border-strong);
    }

    .resume-editor {
      width: 100%;
      min-height: 420px;
      resize: vertical;
      padding: 18px;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      outline: 0;
      color: var(--text);
      background: #071118;
      font: 0.9rem/1.75 Consolas, "Microsoft YaHei", monospace;
    }

    .resume-editor:focus-visible {
      border-color: var(--focus);
      box-shadow: 0 0 0 2px rgba(157, 235, 220, 0.24);
    }

    .resume-editor-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 12px;
    }

    .resume-save-button {
      min-height: 36px;
      padding: 0 15px;
      border: 1px solid #47e3c4;
      border-radius: 6px;
      color: var(--accent-ink);
      background: var(--accent);
      font-weight: 800;
    }

    .empty-state {
      padding: 42px 20px;
      border: 1px dashed var(--border-strong);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
    }

    dialog {
      width: min(92vw, 520px);
      padding: 0;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.66);
    }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(value).replace(/[&<>"']/g, (character) => entities[character]);

    function renderInlineMarkdown(value) {

    }

    function renderMarkdown(source) {
      const lines = source.replace(/\r\n/g, '\n').split('\n');
      const output = [];
      let inList = false;

      lines.forEach((line) => {
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        const listItem = line.match(/^\s*-\s+(.+)$/);

        if (listItem) {
          if (!inList) {
            output.push('<ul>');
            inList = true;
          }
          output.push(`<li>${renderInlineMarkdown(listItem[1])}</li>`);
          return;
        }

        if (inList) {
          output.push('</ul>');
          inList = false;
        }

        if (heading) {
          const level = heading[1].length;
          output.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
        } else if (line.trim()) {
          output.push(`<p>${renderInlineMarkdown(line)}</p>`);
        }
      });

      if (inList) output.push('</ul>');
      return output.join('');
    }

        const editor = document.querySelector('#resume-editor');
        editor.value = resume.content;
        window.requestAnimationFrame(() => editor.focus());
      } else if (resume.pages) {
        resumeReaderBody.innerHTML = renderReadOnlyDocument(resume);
      } else {
        resumeReaderBody.innerHTML = `
          <article class="markdown-document">
            <div class="markdown-content">${renderMarkdown(resume.content)}</div>
          </article>
        `;
      }

      if (resetScroll) resumeReaderBody.scrollTop = 0;
      document.querySelector('#resume-reader-announcer').textContent = `已切换到 ${resume.name}，${resume.editable ? '可编辑' : '只读'}`;
    }

    function changeActiveResume(resumeId) {
      if (state.editingResumeId) {
        showToast('请先保存或取消当前修改');
        renderResumeFiles();
        return;
      }
      state.activeResumeId = resumeId;
      renderResumeFiles();
      renderResumeReader(true);
    }

    function setResumeSelected(resumeId, selected) {
      if (selected) state.selectedResumeIds.add(resumeId);
      else state.selectedResumeIds.delete(resumeId);
      renderResumeFiles();
      updateStartButton();
    }

    function renderResumeContext() {
      const hasResume = resumeDocuments.length > 0;
      document.querySelector('#resume-context').hidden = !hasResume;
      document.querySelector('#resume-empty').hidden = hasResume;
      if (!hasResume) return;
      if (!activeResume()) state.activeResumeId = resumeDocuments[0].id;
      renderResumeFiles();
      renderResumeReader(true);
    }

    function hasActiveFilters() {
      return Boolean(state.filters.query || state.filters.domain || state.filters.difficulty || state.filters.type);
    }

    function syncFilters() {
      document.querySelector('#search-input').value = state.filters.query;
      document.querySelector('#mobile-search-input').value = state.filters.query;
      document.querySelector('#domain-filter').value = state.filters.domain;
      document.querySelector('#mobile-domain-filter').value = state.filters.domain;
      document.querySelector('#difficulty-filter').value = state.filters.difficulty;
      document.querySelector('#mobile-difficulty-filter').value = state.filters.difficulty;
      document.querySelector('#type-filter').value = state.filters.type;
      document.querySelector('#mobile-type-filter').value = state.filters.type;
    }

    function clearFilters() {
      state.filters = { query: '', domain: '', difficulty: '', type: '' };
      syncFilters();
      renderQuestions();
    }

    function updateSettingsSummary() {
      const summary = `${state.pursuit} · ${state.rounds} 轮${state.smartClose ? ' · 智能收束' : ''}`;
      document.querySelector('#settings-summary').textContent = summary;
      document.querySelector('#round-output').textContent = String(state.rounds);
      document.querySelector('#mobile-rounds').value = String(state.rounds);
      document.querySelector('#smart-close').checked = state.smartClose;
      document.querySelector('#mobile-smart-close').checked = state.smartClose;
      document.querySelector('#mobile-pursuit').value = state.pursuit;
      document.querySelectorAll('.pursuit-button').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.pursuit === state.pursuit));
      });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2600);
    }

    document.querySelectorAll('.mode-tab').forEach((button) => {
      button.addEventListener('click', () => switchMode(button.dataset.mode));
    });

    document.querySelectorAll('.sort-tab').forEach((button) => {
      button.addEventListener('click', () => {
        state.sort = button.dataset.sort;
        document.querySelectorAll('.sort-tab').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
        renderQuestions();
      });
    });

    questionGrid.addEventListener('click', (event) => {
      const card = event.target.closest('[data-question]');
      if (!card) return;
      state.selectedQuestion = card.dataset.question;
      renderQuestions();
    });

    roleGrid.addEventListener('click', (event) => {
      const card = event.target.closest('[data-role]');
      if (!card) return;
      if (state.selectedRole !== card.dataset.role) {
        const role = roles.find((item) => item.id === card.dataset.role);
        state.roleTopics = new Set(role?.topics ?? []);
      }
      state.selectedRole = card.dataset.role;
      renderRoles();
      renderAdvancedSettings();
      updateStartButton();
    });

    resumeFileList.addEventListener('click', (event) => {
      const fileButton = event.target.closest('[data-resume-id]');
      if (!fileButton) return;
      changeActiveResume(fileButton.dataset.resumeId);
    });

    resumeFileList.addEventListener('change', (event) => {
      if (!event.target.matches('[data-resume-select]')) return;
      setResumeSelected(event.target.dataset.resumeSelect, event.target.checked);
    });

    resumeMobileSelect.addEventListener('change', (event) => {
      changeActiveResume(event.target.value);
    });

    resumeMobileCheck.addEventListener('change', (event) => {
      setResumeSelected(state.activeResumeId, event.target.checked);
    });

    resumeReader.addEventListener('click', (event) => {
      const actionButton = event.target.closest('[data-resume-action]');
      if (!actionButton) return;
      const resume = activeResume();
      const action = actionButton.dataset.resumeAction;

      if (action === 'edit' && resume.editable) {
        state.editingResumeId = resume.id;
        renderResumeReader();
      }

      if (action === 'cancel') {
        state.editingResumeId = '';
        renderResumeReader();
      }

      if (action === 'save') {
        const editor = document.querySelector('#resume-editor');
        resume.content = editor.value;
        state.editingResumeId = '';
        renderResumeReader(true);
        showToast('简历内容已保存');
      }
    });

    questionGrid.addEventListener('keydown', (event) => {
      if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
      const cards = Array.from(questionGrid.querySelectorAll('.question-card'));
      const current = cards.indexOf(document.activeElement);
      if (current < 0 || cards.length === 0) return;
      event.preventDefault();
      const delta = ['ArrowLeft', 'ArrowUp'].includes(event.key) ? -1 : 1;
      const next = (current + delta + cards.length) % cards.length;
      cards[next].focus();
    });

    ['search-input', 'mobile-search-input'].forEach((id) => {
      document.querySelector(`#${id}`).addEventListener('input', (event) => {
        state.filters.query = event.target.value;
        syncFilters();
        renderQuestions();
      });
    });

    [
      ['domain-filter', 'domain'],
      ['mobile-domain-filter', 'domain'],
      ['difficulty-filter', 'difficulty'],
      ['mobile-difficulty-filter', 'difficulty'],
      ['type-filter', 'type'],
      ['mobile-type-filter', 'type']
    ].forEach(([id, key]) => {
      document.querySelector(`#${id}`).addEventListener('change', (event) => {
        state.filters[key] = event.target.value;
        syncFilters();
        renderQuestions();
      });
    });

    clearFiltersButton.addEventListener('click', clearFilters);
    document.querySelector('#mobile-clear-filters').addEventListener('click', clearFilters);

    document.querySelectorAll('.pursuit-button').forEach((button) => {
      button.addEventListener('click', () => {
        state.pursuit = button.dataset.pursuit;
        updateSettingsSummary();
      });
    });

    document.querySelector('#round-down').addEventListener('click', () => {
      state.rounds = Math.max(1, state.rounds - 1);
      updateSettingsSummary();
    });

    document.querySelector('#round-up').addEventListener('click', () => {
      state.rounds = Math.min(15, state.rounds + 1);
      updateSettingsSummary();
    });

    document.querySelector('#smart-close').addEventListener('change', (event) => {
      state.smartClose = event.target.checked;
      updateSettingsSummary();
    });

    document.querySelector('#mobile-pursuit').addEventListener('change', (event) => {
      state.pursuit = event.target.value;
      updateSettingsSummary();
    });

    document.querySelector('#mobile-rounds').addEventListener('change', (event) => {
      state.rounds = Math.max(1, Math.min(15, Number(event.target.value) || 3));
      updateSettingsSummary();
    });

    document.querySelector('#mobile-smart-close').addEventListener('change', (event) => {
      state.smartClose = event.target.checked;
      updateSettingsSummary();
    });

    const settingsDialog = document.querySelector('#settings-dialog');
    const filterDialog = document.querySelector('#filter-dialog');
    document.querySelector('#more-settings').addEventListener('click', () => {
      renderAdvancedSettings();
      settingsDialog.showModal();
    });
    document.querySelector('#mobile-more-settings').addEventListener('click', () => {
      renderAdvancedSettings();
      settingsDialog.showModal();
    });
    document.querySelector('#open-filters').addEventListener('click', () => filterDialog.showModal());
    document.querySelectorAll('[data-close-dialog]').forEach((button) => {
      button.addEventListener('click', () => document.querySelector(`#${button.dataset.closeDialog}`).close());
    });

    startButton.addEventListener('click', () => {
      if (!currentSelection()) return;
      const labels = { free: '自由面试', role: '岗位专项面试', resume: '简历深挖面试' };
      showToast(`${labels[state.mode]}已就绪`);
    });

    document.querySelector('#target-level').addEventListener('change', (event) => {
      state.targetLevel = event.target.value;
    });

    document.querySelector('#job-keywords').addEventListener('input', (event) => {
      state.jobKeywords = event.target.value;
    });

    document.querySelector('#role-topic-options').addEventListener('change', (event) => {
      if (!event.target.matches('input[type="checkbox"]')) return;
      if (event.target.checked) state.roleTopics.add(event.target.value);
      else state.roleTopics.delete(event.target.value);
    });

    document.querySelector('#role-focus-options').addEventListener('change', (event) => {
      if (!event.target.matches('input[type="checkbox"]')) return;
      if (event.target.checked) state.roleFocus.add(event.target.value);
      else state.roleFocus.delete(event.target.value);
    });

    document.querySelector('#resume-focus-options').addEventListener('change', (event) => {
      if (!event.target.matches('input[type="checkbox"]')) return;
      if (event.target.checked) state.resumeFocus.add(event.target.value);
      else if (state.resumeFocus.size > 1) state.resumeFocus.delete(event.target.value);
      renderAdvancedSettings();
    });

    document.querySelectorAll('.profile-entry').forEach((button) => {
      button.addEventListener('click', () => showToast('请在个人档案中更新简历'));
    });

    renderQuestions();
    renderRoles();
    renderResumeContext();
    renderAdvancedSettings();
    updateSettingsSummary();
    updateStartButton();
  </script>
</body>
</html>
