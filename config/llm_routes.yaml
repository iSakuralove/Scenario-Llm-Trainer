# LLM 顺序路由配置 —— 替代 LiteLLM 网关的薄路由层
#
# 规则：
#   1. 按 providers 声明顺序尝试；默认请求第一个「key 非空」的站点
#   2. key 留空（${VAR} 未设置）= 该站不参与路由，自动跳过
#   3. 任一站点失败（限流 / 网络错误 / 鉴权失败 / 5xx）自动切下一站
#   4. 全部条目按 OpenAI Chat Completions 兼容协议调用
#
# base_url / model 已预置官方默认值，通常只需要填 api_key；
# 想换模型在同一条目写 model 覆盖。key 引用 .env 的环境变量，不落盘。
#
# 重新排序 = 调整 providers 顺序；重启 agent 与 api 容器生效。

providers:
  - name: glm-official
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key: ${GLM_API_KEY}
    model: glm-4.7

  - name: deepseek-official
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_KEY}
    model: deepseek-v4-flash

  - name: minimax-official
    base_url: https://api.minimax.io/v1
    api_key: ${MINIMAX_API_KEY}
    model: MiniMax-M2.7

  # 中转站示例：取消注释并填 key 即启用，顺序放在哪就第几个被尝试
