# LLM 顺序路由配置 —— 模板
#
# 使用方法：复制为 config/llm_routes.yaml（该文件被 gitignore，可放心填真实 key）
#   cp config/llm_routes.example.yaml config/llm_routes.yaml
#
# 规则：
#   1. providers 按 declaration 顺序尝试；默认请求第一个「key 非空」的站点
#   2. key 留空 = 该站不参与路由，自动跳过
#   3. 任一站点失败（限流 / 网络错误 / 鉴权失败 / 5xx）自动切下一站
#   4. 全部条目走 OpenAI Chat Completions 兼容协议
#
# key 两种写法都支持：
#   api_key: sk-直接粘贴          ← 推荐，配置只看这一个文件
#   api_key: ${MY_KEY}            ← 引用系统环境变量（存在则生效）
#
# 官方三家最大输出 token（官方文档口径，省略时自动按域名补默认）：
#   GLM-5.3          128K（上下文 200K）
#   DeepSeek-V4      384K（上下文 1M）
#   MiniMax-M2.7     128K（通常 16K 已够用，上下文约 205K）

providers:
  - name: glm-official
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key:
    model: glm-5.3
    max_tokens: 131072

  - name: deepseek-official
    base_url: https://api.deepseek.com
    api_key:
    model: deepseek-v4-flash
    max_tokens: 393216

  - name: minimax-official
    base_url: https://api.minimax.io/v1
    api_key:
    model: MiniMax-M2.7
    max_tokens: 131072

  # 中转站示例：追加条目即启用，顺序放在哪就第几个被尝试
  # - name: my-proxy
  #   base_url: https://your-proxy.example.com/v1
  #   api_key:
  #   model: gpt-5.6
  #   max_tokens: 65536
  #   extra_headers:              # 部分中转站要求特定 User-Agent
  #     User-Agent: python-httpx/0.28.1

# 语义检索 embedding 端点（key 为空时回退本地相似度规则）
embedding:
  base_url:
  api_key:
  model:
  fallback_model:
  timeout_seconds: 8

# 语音转写端点（key 为空时使用内置 Mock 转写）
stt:
  base_url:
  api_key:
  model:
  timeout_seconds: 60
