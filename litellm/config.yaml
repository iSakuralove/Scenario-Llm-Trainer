model_list:
  # ============ 智谱国内站（直连 key） ============
  - model_name: glm-direct
    litellm_params:
      model: openai/GLM-5.3
      api_key: os.environ/GLM_API_KEY
      base_url: https://open.bigmodel.cn/api/paas/v4

  # ============ 宣安中转站 aitoken.forum（一个 key 17 个模型） ============
