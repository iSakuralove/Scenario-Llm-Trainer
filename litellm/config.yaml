      extra_headers: {"User-Agent": "python-httpx/0.28.1"}

litellm_settings:
  # 流式默认开启；drop 此参数防止上游拒绝未知参数
  modify_params: true
  # 请求失败重试 1 次（指数退避），流式请求不重试
  num_retries: 1
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  # 站内互备：DeepSeek 系挂了切 glm-relay，反之亦然
  routing_strategy: simple-shuffle
  num_retries: 1
  timeout: 120
  fallbacks:
    - deepseek-flash: [glm-relay]
    - mentor-default: [deepseek-flash]
    - interpreter-default: [glm-relay]
    - generator-default: [deepseek-flash]
    - glm-relay: [deepseek-flash]
