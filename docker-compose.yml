name: teaching-mvp

services:
  api:
    build:
      context: ./backend
    volumes:
      - ./config/llm_routes.yaml:/app/llm_routes.yaml:ro
    environment:
      LLM_ROUTES_FILE: /app/llm_routes.yaml
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a long random string}
      STORE_MODE: postgres
      DATABASE_URL: postgres://teaching:teaching@postgres:5432/teaching_mvp?sslmode=disable
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      REDIS_URL: redis://redis:6379/0
      AGENT_BASE_URL: http://agent:8090
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-20}
      AGENT_TURN_DEADLINE_MS: ${AGENT_TURN_DEADLINE_MS:-15000}
      SCENARIO_VALIDATION_MODE: ${SCENARIO_VALIDATION_MODE:-strict}
      # Runtime V2 迁移期间，过程事件只做影子校验并丢弃坏事件，不能阻断回复正文；
      # proposal / reply guard 仍由 SCENARIO_VALIDATION_MODE= strict 保护。
      SCENARIO_PUBLIC_TRACE_VALIDATION_MODE: ${SCENARIO_PUBLIC_TRACE_VALIDATION_MODE:-log}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-}
      ZETA_KEY: ${ZETA_KEY:-}
      JIANYI_API_KEY: ${JIANYI_API_KEY:-}
      DEEPSEEK_KEY: ${DEEPSEEK_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_MODEL: ${GLM_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_FALLBACK_MODEL: ${EMBEDDING_FALLBACK_MODEL:-}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      agent:
        condition: service_healthy

  agent:
    build:
      context: ./agent
    volumes:
      - ./config/llm_routes.yaml:/app/llm_routes.yaml:ro
    environment:
      HIDDENWORLD_HOST: 0.0.0.0
      HIDDENWORLD_PORT: 8090
      HIDDENWORLD_ALLOW_MODEL_REQUESTS: ${HIDDENWORLD_ALLOW_MODEL_REQUESTS:-0}
      LLM_ROUTES_FILE: /app/llm_routes.yaml
      HIDDENWORLD_INTERPRETER_PROVIDER: ${HIDDENWORLD_INTERPRETER_PROVIDER:-routes}
      HIDDENWORLD_MENTOR_PROVIDER: ${HIDDENWORLD_MENTOR_PROVIDER:-routes}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://api.z.ai/api/paas/v4}
      ZAI_MODEL: ${ZAI_MODEL:-glm-4.7}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-}
      GLM_MODEL: ${GLM_MODEL:-glm-4.7}
      XUAN_BASE_URL: ${XUAN_BASE_URL:-https://ai.centos.hk/v1}
      XUAN_API_KEY: ${XUAN_API_KEY:-}
      XUAN_MODEL: ${XUAN_MODEL:-gpt-5.6-terra}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: teaching_mvp
      POSTGRES_USER: teaching
      POSTGRES_PASSWORD: teaching
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
